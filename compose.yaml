services:
  api:
    build:
      context: .
      target: runtime
    environment:
      PORT: 8000
      EVENT_LOG_PATH: /data/events.jsonl
    ports:
      - "8000:8000"
    volumes:
      - shipping-events:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/health"]
      interval: 5s
      timeout: 2s
      retries: 5

volumes:
  shipping-events:
